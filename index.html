<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词速刷 · Vocab Drill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233e8e68'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="tb-group">
    <span class="logo">⚡ 单词速刷</span>
    <select id="book" title="切换词书"></select>
    <button id="mode" class="chip" title="切换学习模式（快捷键 M）">识别模式</button>
  </div>
  <div class="tb-group">
    <span id="today" class="muted"></span>
    <span id="streak" class="chip" title="连续打卡天数">🔥 0</span>
    <button id="btn-stats" class="icon" title="统计与生词本">📊</button>
    <button id="btn-settings" class="icon" title="设置">⚙️</button>
  </div>
</header>

<main>
  <!-- 学习页 -->
  <section id="page-study" class="page">
    <div id="study-sub">
      <span id="study-sub-text"></span>
      <button id="sub-chapters" class="chip" title="选择章节">章节</button>
    </div>
    <div id="pbar"><div id="pbar-in"></div></div>
    <section id="card" class="card">
      <p class="muted center">正在加载词库…</p>
    </section>
  </section>

  <!-- 词书分级页 -->
  <section id="page-books" class="page hidden">
    <div id="books-root"></div>
  </section>

  <!-- 查词页 -->
  <section id="page-dict" class="page hidden">
    <input id="dict-search" placeholder="查单词：输入英文（支持部分匹配）">
    <div id="dict-results" class="rowlist"></div>
  </section>

  <!-- 单词本页 -->
  <section id="page-list" class="page hidden">
    <div class="seg" id="list-tabs">
      <button data-t="all">已背</button>
      <button data-t="mastered">已掌握</button>
      <button data-t="unseen">未背</button>
      <button data-t="wrong">错词</button>
      <button data-t="star">收藏</button>
      <button data-t="star2">重点</button>
    </div>
    <div id="list-head" class="hidden"><button id="redrill" class="big primary">重刷错词</button></div>
    <input id="list-filter" placeholder="在当前分组中筛选…">
    <div id="list-results" class="rowlist"></div>
  </section>
</main>

<footer class="hints" id="hints">
  <span><kbd>空格</kbd> 显示释义 / 认识</span>
  <span><kbd>1</kbd> 不认识</span>
  <span><kbd>2</kbd> 模糊</span>
  <span><kbd>3</kbd> 认识</span>
  <span><kbd>M</kbd> 切换模式</span>
  <span><kbd>F</kbd> 收藏</span>
  <span><kbd>Ctrl+Z</kbd> 撤销</span>
</footer>

<nav id="nav">
  <button data-page="study" class="active"><span class="ni">📖</span>学习</button>
  <button data-page="books"><span class="ni">📚</span>词书</button>
  <button data-page="dict"><span class="ni">🔍</span>查词</button>
  <button data-page="list"><span class="ni">🗂️</span>单词本</button>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modal-x" class="icon modal-x" title="关闭">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script type="module">
  /* FSRS-5 记忆算法（ts-fsrs，本地打包，离线可用） */
  import { fsrs, generatorParameters, createEmptyCard, Rating, State } from './vendor/fsrs.js';
  window.FSRSLIB = { fsrs, generatorParameters, createEmptyCard, Rating, State };
</script>
<script src="js/app.js"></script>
</body>
</html>
